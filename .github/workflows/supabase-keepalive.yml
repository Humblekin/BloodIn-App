name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ghobtkofruqgcehdmrfd.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Ping Supabase REST API
        run: |
          url="${SUPABASE_URL//[[:space:]]/}"
          url="${url%/}"
          if [ -z "${url}" ]; then
            echo "Error: SUPABASE_URL secret is empty or not set"
            exit 1
          fi
          case "${url}" in
            http://*|https://*) : ;;
            *) echo "Error: SUPABASE_URL must start with http:// or https://"; exit 1 ;;
          esac
          headers=(-H "Accept: application/json")
          if [ -n "${SUPABASE_ANON_KEY}" ]; then
            headers+=(-H "apikey: ${SUPABASE_ANON_KEY}")
          else
            echo "SUPABASE_ANON_KEY is not configured; using an unauthenticated reachability check"
          fi
          status=$(curl -sS --connect-timeout 15 --max-time 30 -o /dev/null -w "%{http_code}" \
            "${headers[@]}" \
            "${url}/rest/v1/")
          echo "Supabase responded with HTTP ${status}"
          if [ "${status}" -eq 0 ]; then
            echo "Error: Could not reach Supabase"
            exit 1
          fi
